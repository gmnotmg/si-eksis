version: '3.8'

services:
  backend:
    build: ./backend
    container_name: sieksis-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      DB_PATH: /app/data/si_eksis.db
      UPLOAD_PATH: /app/uploads
      MAX_FILE_SIZE: 10485760
      FRONTEND_URL: http://localhost:3000
    volumes:
      # - db_data:/app/data        # SQLite database persist
      # - uploads_data:/app/uploads # PDF uploads persist
      - ./backend/src/db:/app/data
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: sieksis-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

